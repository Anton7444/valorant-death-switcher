name: 问题反馈
description: 报告死亡识别、浏览器切换、回合切回或启动问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 的常见问题。日志和截图可能包含用户名、路径等信息，上传前请自行检查并遮盖。
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 游戏模式
      options:
        - 爆破模式
        - 极速模式
        - 其他模式
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: 分辨率与显示模式
      placeholder: 1920×1080，独占全屏
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 说明预期结果和实际结果，以及是否每次都能复现。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: 界面状态与相关事件
      description: 请提供游戏、回合、捕获、识别、判断原因及相关时间段的事件；不要上传未经检查的完整日志。
