name: Build

on:
  workflow_dispatch:
  push:
    branches: [ccr-fd6e5e6e-y7oph4]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --distpath dist-onefile --workpath build-onefile ValorantDeathSwitcherOneFile.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ValorantDeathSwitcher
          path: dist-onefile/ValorantDeathSwitcherStandalone.exe
