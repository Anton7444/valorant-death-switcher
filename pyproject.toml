[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-death-switcher"
version = "0.1.0"
description = "Conservative on-screen death detection and round-log window switching for VALORANT CN"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dxcam[winrt]>=0.3,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "PySide6>=6.8,<7",
  "pywin32>=308",
  "websocket-client>=1.8,<2",
  "psutil>=6,<8",
]

[project.scripts]
valorant-death-switcher = "valorant_switcher.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valorant_switcher = ["templates/*.json", "templates/*.png", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
